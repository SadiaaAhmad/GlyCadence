name: GlyCadence Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: glycadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@127.0.0.1:5432/glycadence
      JWT_SECRET_KEY: ci-test-jwt-secret-key-at-least-32-chars-long-2026
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Run Alembic migrations and round-trip check
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run full pytest suite
        working-directory: backend
        run: |
          pytest -v
